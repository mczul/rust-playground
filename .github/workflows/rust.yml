name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ubuntu:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: cargo test --verbose
    - name: Build
      run: cargo build --release --verbose

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: cargo test --verbose
    - name: Build
      run: cargo build --release --verbose

  build-macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: cargo test --verbose
    - name: Build
      run: cargo build --release --verbose
